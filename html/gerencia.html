<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerencia</title>
    <link rel="stylesheet" href="/static/css/gerencia.css">
</head>

<body>
    <header>
        <nav>

        </nav>
    </header>

    <section class="financeiro">

        <h3>Despesas</h3>

        <form id="form-despesas">
            <label for="nome_despesa">Nome:</label>
            <input type="text" id="nome_despesa" name="nome">

            <label for="valor_despesa">Valor:</label>
            <input type="number" id="valor_despesa" name="valor">

            <label for="pagamento_despesa">Forma de pagamento</label>
            <input type="text" id="pagamento_despesa" name="pagamento">

            <button type="submit">Adicionar</button>

        </form>

        <h3>Compras</h3>

        <form id="form-compras">

            <label for="compras_produtos">Produto:</label>
            <input type="text" id="compras_produtos" name="compras_produtos">

            <label for="valor_compras">Valor:</label>
            <input type="number" id="valor_compras" name="valor_compras">

            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" name="quantidade">

            <label for="data">Data:</label>
            <input type="date" id="data" name="data">

            <button type="submit">Adicionar</button>

        </form>

        <h3>Funcionarios</h3>

        <form id="form_funcionarios">

            <label for="funcionarios">Nome:</label>
            <input type="text" id="funcionarios" name="funcionarios">

            <label for="cargo">Cargo:</label>
            <input type="text" id="cargo" name="cargo">

            <label for="salario">Salário:</label>
            <input type="number" id="salario" name="salario">

            <button type="submit">Adicionar</button>

        </form>
    </section>
    <br>
    <br>
    <section class="dados">

        <h3>Despesas</h3>
        <div id="lista-despesas" class="cards-container"></div>

    </section>

    <section class="dados">

        <h3>Compras</h3>
        <div id="lista-compras" class="cards-container"></div>

    </section>

    <section class="dados">

        <h3>Funcionarios</h3>
        <div id="lista-funcionarios" class="cards-container"></div>

    </section>

    <script src="/static/js/gerencia/gerencia.js" defer></script>
    
</body>

</html>
