<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração</title>
    <link rel="stylesheet" href="/static/css/config.css">
</head>

<body>
    <div class="container">

        <main class="main-content">
            <h2>Página de Configuração</h2>

            <div class="cards-container">
                <div class="card">
                    <h3 class="card-title">Perfil do Usuário</h3>
                    <form id="form-usuario" class="card-form">
                        <label for="nome">Nome: </label>
                        <input class="card-input" type="text" id="nome" name="nome" required>

                        <label for="email">Email: </label>
                        <input class="card-input" type="email" id="email" name="email" required>

                        <label for="senha">Senha: </label>
                        <input class="card-input" type="password" id="senha" name="senha">

                        <label for="tipo_acesso">Tipo de acesso:</label>
                        <select id="tipo_acesso" class="card-input">
                            <option value="comum">Comum</option>
                            <option value="admin">Admin</option>
                        </select>

                        <button type="submit" class="btn">Salvar Alterações</button>

                        <!-- criar a rota para definir hierarquia a partir do email, para definir o tipo de acesso do usuário -->
                    </form>
                </div>

                <div class="card">
                    <h3 class="card-title">Preferências do Sistema</h3>
                    <form id="form-preferencias" class="card-form">
                        <label for="tema">Tema:</label>
                        <select id="tema" name="tema">
                            <option value="claro">Claro</option>
                            <option value="escuro">Escuro</option>
                        </select>

                        <label for="notificacoes">Notificações:</label>
                        <input type="checkbox" id="notificacoes" name="notificacoes" checked>

                        <button type="submit" class="btn">Salvar Preferências</button>
                    </form>
                </div>

                <div class="card">
                    <h3 class="card-title">Segurança</h3>
                    <form class="card-form">
                        <label for="senha-atual">Senha Atual:</label>
                        <input class="card-input" type="password" id="senha-atual" name="senha-atual" required>

                        <label for="nova-senha">Nova Senha:</label>
                        <input class="card-input" type="password" id="nova-senha" name="nova-senha" required>

                        <button type="submit" class="btn">Alterar Senha</button>
                    </form>
                </div>

                <div class="card">
                    <h3 class="card-title">Backup de Dados</h3>
                    <p>Você pode baixar um backup completo do sistema ou restaurar dados anteriores.</p>

                    <div class="card-actions" style="display: flex; flex-direction: column; gap: 10px;">
                        <button id="btnBackup" class="btn">Fazer Backup</button>

                        <hr>

                        <!-- Input de arquivo adicionado aqui -->
                        <label for="inputBackup" style="font-size: 0.9rem; font-weight: bold;">Restaurar de
                            arquivo:</label>
                        <input type="file" id="inputBackup" accept=".db" class="card-input">

                        <button id="btnRestaurar" class="btn-backup">Confirmar Restauração</button>
                    </div>
                </div>
            </div>

            <section class="card_usuario">
                <h2 class="card-title">Usuários</h2>
                <!-- Remova a classe .card daqui de cima e deixe o container de lista limpo -->
                <div id="lista-usuarios">
                    <!-- O seu JS vai injetar vários <div class="card"> aqui dentro -->
                </div>
            </section>
        </main>
    </div>

    <a href="/html/dashboard" class="btn-voltar">← Voltar</a>

    <!-- <script src="/static/js/configuracao/cadastro_usuario.js"> </script> -->
    <script src="/static/js/configuracao/usuario.js"> </script>

</body>

</html>
