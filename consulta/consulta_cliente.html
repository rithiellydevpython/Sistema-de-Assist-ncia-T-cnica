<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Clientes</title>
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/css/tabela.css">
    <link rel="stylesheet" href="/static/css/botoes.css">
</head>

<body>

    <main>

        <section class="search-section">
            <label class="search-label" for="searchInput">Pesquisar cliente </label>

            <input id="searchInput" placeholder="Digite o nome do cliente">
        </section>

        <section class="table-section">

            <table id="tabela-cliente" class="tableclass">
                <caption class="caption-table">Clientes</caption>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Número</th>
                        <th>Endereço</th>
                        <th>CPF</th>
                    </tr>
                </thead>

                <tbody id="tbody-cliente">

                </tbody>
            </table>
            <div class="topo-acoes">
                <a href="/html/dashboard" class="btn-voltar">← Voltar</a>
            </div>
        </section>
    </main>
    <script src="/static/js/consulta/consulta_cliente.js"> </script>
</body>
